<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" aria-labelledby="title"><title id="title">Rural landscape with satellite overlay</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B3F"/>
      <stop offset="100%" stop-color="#102657"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28A745" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#28A745" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#sky)"/>
  <circle cx="120" cy="80" r="2" fill="#fff"/>
  <circle cx="180" cy="60" r="1.5" fill="#fff"/>
  <circle cx="240" cy="100" r="1.5" fill="#fff"/>
  <circle cx="300" cy="70" r="2" fill="#fff"/>
  <path d="M0 330 C 200 260, 360 300, 520 320 C 700 350, 860 300, 960 320 L 960 420 L 0 420 Z" fill="url(#hill)"/>
  <g transform="translate(720,90)">
    <circle cx="0" cy="0" r="16" fill="#fff"/>
    <rect x="-28" y="-8" width="18" height="16" fill="#fff"/>
    <rect x="10" y="-8" width="18" height="16" fill="#fff"/>
  </g>
  <path d="M 720 90 C 520 160, 380 180, 240 220" stroke="#28A745" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <rect x="220" y="240" width="40" height="28" fill="#fff"/>
  <polygon points="220,240 240,230 260,240" fill="#fff"/>
</svg>